name: Recovery2 Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'MANIFEST_URL (SSH: git@github.com:XXXXX)'
        required: true
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: 'twrp-12.1'
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
        default: 'https://github.com/xyyyico/device-5g-L39_IVVI_4_64_V80M60BP_NZW_BT30.git'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
        default: 'main'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/5g/L39_IVVI_4_64_V80M60BP_NZW_BT30'
      COMMON_TREE_URL:
        description: 'COMMON_TREE_URL (空则不填)'
        required: false
        default: ''
      COMMON_TREE_BRANCH:
        description: 'COMMON_TREE_BRANCH'
        required: false
        default: ''
      COMMON_PATH:
        description: 'COMMON_PATH (空则不填)'
        required: false
        default: ''
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'L39_IVVI_4_64_V80M60BP_NZW_BT30'
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME'
        required: true
        default: 'twrp_L39_IVVI_4_64_V80M60BP_NZW_BT30'
      BUILD_TARGET:
        description: 'BUILD_TARGET (recovery / boot)'
        required: true
        default: 'boot'

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Display Parameters
        run: |
          echo "::group::Parameters"
          echo "Manifest: ${{ inputs.MANIFEST_BRANCH }}"
          echo "Device: ${{ inputs.DEVICE_NAME }}"
          echo "Makefile: ${{ inputs.MAKEFILE_NAME }}"
          echo "Target: ${{ inputs.BUILD_TARGET }}"
          echo "::endgroup::"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Cleanup
        uses: rokibhasansagar/slimhub_actions@main

      - name: Prepare Build Environment
        run: |
          sudo apt clean
          sudo apt update -y
          sudo apt upgrade -y
          DEBIAN_FRONTEND=noninteractive sudo apt install -y \
            git ccache gcc-multilib g++-multilib libncurses-dev \
            lib32ncurses-dev lib32z-dev lz4 lzop schedtool \
            squashfs-tools zip unzip curl python3 python-is-python3 \
            x11proto-core-dev libx11-dev libgl1-mesa-dev libxml2-utils

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Setup SSH
        if: startsWith(inputs.MANIFEST_URL, 'git@') || startsWith(inputs.DEVICE_TREE_URL, 'git@') || startsWith(inputs.COMMON_TREE_URL, 'git@')
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install Repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod +x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Init Repo
        run: |
          mkdir -p workspace
          cd workspace
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          repo init --depth=1 -u ${{ inputs.MANIFEST_URL }} -b ${{ inputs.MANIFEST_BRANCH }}

      - name: Repo Sync
        run: repo sync -c -j$(nproc) --force-sync --no-clone-bundle
        working-directory: workspace

      - name: Clone Device Tree
        run: git clone ${{ inputs.DEVICE_TREE_URL }} -b ${{ inputs.DEVICE_TREE_BRANCH }} ./${{ inputs.DEVICE_PATH }}
        working-directory: workspace

      - name: Clone Common Tree
        if: inputs.COMMON_TREE_URL != '' && inputs.COMMON_PATH != ''
        run: git clone ${{ inputs.COMMON_TREE_URL }} -b ${{ inputs.COMMON_TREE_BRANCH }} ./${{ inputs.COMMON_PATH }}
        working-directory: workspace

      - name: Detect Build Type
        uses: haya14busa/action-cond@v1
        id: buildtype
        with:
          cond: ${{ contains(inputs.MANIFEST_BRANCH, 'twrp') }}
          if_true: twrp
          if_false: omni

      - name: Sync Device Dependencies
        run: |
          if [ -f ${{ inputs.DEVICE_PATH }}/${{ steps.buildtype.outputs.value }}.dependencies ]; then
            bash ../scripts/convert.sh ${{ inputs.DEVICE_PATH }}/${{ steps.buildtype.outputs.value }}.dependencies
            repo sync -j$(nproc)
          fi
        working-directory: workspace
        continue-on-error: true

      - name: Setup Swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 14

      - name: Enable CCache
        run: |
          echo "USE_CCACHE=1" >> $GITHUB_ENV
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
          ccache -M 10G
        working-directory: workspace

      - name: Build Recovery
        run: |
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export SKIP_ABI_CHECKS=true
          lunch ${{ inputs.MAKEFILE_NAME }}-eng
          make clean
          make ${{ inputs.BUILD_TARGET }}image -j$(nproc)
        working-directory: workspace

      # ✅ 修复：正确的 action 名称
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            workspace/out/target/product/${{ inputs.DEVICE_NAME }}/${{ inputs.BUILD_TARGET }}.img
            workspace/out/target/product/${{ inputs.DEVICE_NAME }}/*.zip
            workspace/out/target/product/${{ inputs.DEVICE_NAME }}/vendor_boot.img
            workspace/out/target/product/${{ inputs.DEVICE_NAME }}/dtbo.img
          name: TWRP-${{ inputs.DEVICE_NAME }}-${{ github.run_id }}
          tag_name: ${{ github.run_id }}
          body: |
            ✅ Build Successful
            Manifest: ${{ inputs.MANIFEST_BRANCH }}
            Device: ${{ inputs.DEVICE_NAME }}
            Makefile: ${{ inputs.MAKEFILE_NAME }}
            Target: ${{ inputs.BUILD_TARGET }}.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

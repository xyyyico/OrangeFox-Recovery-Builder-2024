# 工作流名称：OrangeFox - Build（已适配你的设备）
name: OrangeFox - Build

# 手动触发编译
on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: OrangeFox 分支
        required: true
        default: 12.1
        type: choice
        options:
        - 14.1
        - 12.1
        - 11.0

      # 👉 你的设备树仓库（已填好）
      DEVICE_TREE:
        description: 设备树地址
        required: true
        default: https://github.com/xyyyico/device-5g-L39_IVVI_4_64_V80M60BP_NZW_BT30.git

      # 设备树分支
      DEVICE_TREE_BRANCH:
        description: 设备树分支
        required: true
        default: main

      # 👉 你的设备路径（已填好）
      DEVICE_PATH:
        description: 设备路径
        required: true
        default: device/5g/L39_IVVI_4_64_V80M60BP_NZW_BT30

      # 👉 你的设备代号（已填好）
      DEVICE_NAME:
        description: 设备代号
        required: true
        default: L39_IVVI_4_64_V80M60BP_NZW_BT30

      # 👉 你的手机必须用 boot
      BUILD_TARGET:
        description: 编译类型（必选 boot）
        required: true
        default: boot
        type: choice
        options:
        - boot
        - recovery
        - vendorboot

      LDCHECK:
        description: 库检查路径
        required: true
        default: system/bin/qseecomd

      RECOVERY_TAR:
        description: 三星专用（关闭）
        required: false
        default: false
        type: boolean

      RECOVERY_INSTALLER:
        description: 生成卡刷包
        type: boolean
        required: true
        default: true

# 编译任务
jobs:
  build:
    name: Build OrangeFox for your device
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Display Inputs
      run: |
        echo "设备树: ${{ github.event.inputs.DEVICE_TREE }}"
        echo "设备路径: ${{ github.event.inputs.DEVICE_PATH }}"
        echo "设备代号: ${{ github.event.inputs.DEVICE_NAME }}"
        echo "编译类型: ${{ github.event.inputs.BUILD_TARGET }}"

    - name: Clean-up
      uses: rokibhasansagar/slimhub_actions@main

    - name: Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24

    - name: Build Environment
      run: |
        sudo apt update
        sudo apt -y upgrade
        git clone https://gitlab.com/OrangeFox/misc/scripts
        cd scripts
        sudo bash setup/android_build_env.sh

    - name: Set-up Manifest
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/OrangeFox
        cd ${GITHUB_WORKSPACE}/OrangeFox
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git clone https://gitlab.com/OrangeFox/sync.git
        cd sync
        ./orangefox_sync.sh --branch ${{ github.event.inputs.MANIFEST_BRANCH }} --path ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}

    # 克隆你的设备树
    - name: Clone Device Tree
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        git clone ${{ github.event.inputs.DEVICE_TREE }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
        cd ${{ github.event.inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: Check Manifest Branch
      uses: haya14busa/action-cond@v1
      id: fox_branch
      with:
        cond: ${{ github.event.inputs.MANIFEST_BRANCH == '11.0' || github.event.inputs.MANIFEST_BRANCH == '12.1' }}
        if_true: lunch twrp_${{ github.event.inputs.DEVICE_NAME }}-eng && make clean && mka adbd ${{ github.event.inputs.BUILD_TARGET }}image
        if_false: lunch omni_${{ github.event.inputs.DEVICE_NAME }}-eng && make clean && mka ${{ github.event.inputs.BUILD_TARGET }}image

    - name: Building OrangeFox
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        set +e
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        set -e
        ${{ steps.fox_branch.outputs.value }}

    - name: Set Build Date
      run: |
        echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
        DEVICE_TREE_URL="${{ github.event.inputs.DEVICE_TREE }}"
        if [[ "${DEVICE_TREE_URL}" == *.git ]]; then
          DEVICE_TREE_URL="${DEVICE_TREE_URL%.git}"
        fi
        echo "DEVICE_TREE_URL=${DEVICE_TREE_URL}" >> $GITHUB_ENV

    - name: Check if Recovery Exist
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        if [ -f out/target/product/${{ github.event.inputs.DEVICE_NAME }}/OrangeFox*.img ]; then
            echo "CHECK_IMG_IS_OK=true" >> $GITHUB_ENV
            echo "FILE_PATH=${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}" >> $GITHUB_ENV
            echo "MD5_IMG=$(md5sum out/target/product/${{ github.event.inputs.DEVICE_NAME }}/OrangeFox*.img | cut -d ' ' -f 1)" >> $GITHUB_ENV
        else
            echo "编译失败，未生成镜像"
            exit 1
        fi

    - name: Rename the Recovery
      run: |
        cd ${{ env.FILE_PATH }}
        if [ "${{ github.event.inputs.BUILD_TARGET }}" = "boot" ]; then
          mv OrangeFox*.img boot.img
          echo "RECOVERY_TYPE=boot" >> $GITHUB_ENV
        fi

    - name: Include Recovery Installer
      run: |
        if [ ${{ github.event.inputs.RECOVERY_INSTALLER }} = true ]; then
          cd ${{ env.FILE_PATH }}
          wget https://github.com/kinguser981/recovery-installer/releases/download/11256427880/recovery-installer.zip
          zip -ur recovery-installer.zip boot.img
        fi

    - name: Upload to Release
      if: env.CHECK_IMG_IS_OK == 'true'
      uses: softprops/gh-release@v2
      with:
        files: |
          ${{ env.FILE_PATH }}/boot.img
          ${{ env.FILE_PATH }}/recovery-installer.zip
        name: OrangeFox-${{ github.event.inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          设备: ${{ github.event.inputs.DEVICE_NAME }}
          类型: boot.img
          分支: ${{ github.event.inputs.MANIFEST_BRANCH }}

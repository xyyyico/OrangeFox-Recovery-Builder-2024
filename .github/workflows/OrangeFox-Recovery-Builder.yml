# OrangeFox Recovery 编译 - 已修复源码拉取认证问题
name: OrangeFox Build

on:
  workflow_dispatch:
    inputs:
      # ✅ 修复：使用公开可拉取的 OrangeFox 镜像（无需登录）
      MANIFEST_URL:
        description: 'OrangeFox Manifest (公开镜像)'
        required: true
        default: 'https://github.com/OrangeFoxRecovery/manifest.git'
      MANIFEST_BRANCH:
        description: 'OF 版本分支'
        required: true
        default: 'fox_12.1'
      DEVICE_TREE_URL:
        description: '设备树仓库'
        required: true
        default: 'https://github.com/xyyyico/device-5g-L39_IVVI_4_64_V80M60BP_NZW_BT30.git'
      DEVICE_TREE_BRANCH:
        description: '设备树分支'
        required: true
        default: 'main'
      DEVICE_PATH:
        description: '设备源码路径'
        required: true
        default: 'device/5g/L39_IVVI_4_64_V80M60BP_NZW_BT30'
      COMMON_TREE_URL:
        description: '公共树（留空）'
        required: false
        default: ''
      COMMON_TREE_BRANCH:
        description: '公共树分支'
        required: false
        default: ''
      COMMON_PATH:
        description: '公共树路径'
        required: false
        default: ''
      DEVICE_NAME:
        description: '设备代号'
        required: true
        default: 'L39_IVVI_4_64_V80M60BP_NZW_BT30'
      MAKEFILE_NAME:
        description: '编译目标名称'
        required: true
        default: 'twrp_L39_IVVI_4_64_V80M60BP_NZW_BT30'
      BUILD_TARGET:
        description: '编译镜像（boot）'
        required: true
        default: 'boot'

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 显示编译参数
        run: |
          echo "::group::编译信息"
          echo "OF分支: ${{ inputs.MANIFEST_BRANCH }}"
          echo "设备: ${{ inputs.DEVICE_NAME }}"
          echo "目标: ${{ inputs.BUILD_TARGET }}.img"
          echo "::endgroup::"

      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 清理系统空间
        uses: rokibhasansagar/slimhub_actions@main

      - name: 安装编译依赖
        run: |
          sudo apt update -y
          sudo apt install -y git ccache repo lz4 zipalign curl python3

      - name: 安装 Repo 工具
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod +x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: 初始化 OrangeFox 源码
        run: |
          mkdir -p workspace
          cd workspace
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          repo init --depth=1 -u ${{ inputs.MANIFEST_URL }} -b ${{ inputs.MANIFEST_BRANCH }}

      - name: 同步 OrangeFox 源码
        run: repo sync -c -j$(nproc) --force-sync --no-clone-bundle
        working-directory: workspace

      - name: 克隆设备树
        run: git clone ${{ inputs.DEVICE_TREE_URL }} -b ${{ inputs.DEVICE_TREE_BRANCH }} ./${{ inputs.DEVICE_PATH }}
        working-directory: workspace

      - name: 设置虚拟内存
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 14

      - name: 开启编译加速
        run: |
          echo "USE_CCACHE=1" >> $GITHUB_ENV
          ccache -M 15G
        working-directory: workspace

      - name: 开始编译 OrangeFox
        run: |
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_TYPE=stable
          lunch ${{ inputs.MAKEFILE_NAME }}-eng
          make clean
          mka bootimage
        working-directory: workspace

      - name: 上传编译产物
        uses: softprops/action-gh-release@v2
        with:
          files: |
            workspace/out/target/product/${{ inputs.DEVICE_NAME }}/boot.img
            workspace/out/target/product/${{ inputs.DEVICE_NAME }}/OrangeFox-*.zip
          name: OrangeFox-${{ inputs.DEVICE_NAME }}-boot
          tag_name: ${{ github.run_id }}
          body: |
            ✅ OrangeFox 编译成功
            设备：${{ inputs.DEVICE_NAME }}
            镜像：boot.img（无REC分区专用）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
